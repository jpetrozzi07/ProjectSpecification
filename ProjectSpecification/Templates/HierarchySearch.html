<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
	<meta name="description" content="" />
	<meta name="author" content="" />
	<title>GO Hierarchy Search</title>
	<!-- Favicon-->
	<link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
	<!-- Bootstrap icons-->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet" />
	<!-- Core theme CSS (includes Bootstrap)-->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
	
	<script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
	<link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
		<div class="container px-lg-5">
			<a class="navbar-brand" href="/">Go Analyzer</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
			<div class="collapse navbar-collapse" id="navbarSupportedContent">
				<ul class="navbar-nav ms-auto mb-2 mb-lg-0">
					<li class="nav-item"><a class="nav-link active" aria-current="page" href="/">Home</a></li>
				</ul>
			</div>
		</div>
	</nav>
	
	<!-- Header-->
	<header class="py-5">
		<div class="container px-lg-5">
			<div class="p-1 p-lg-1 bg-light rounded-3 text-center">
				<div class="m-2 m-lg-2">
					<h1 class="display-5 fw-bold">Search GO Term Hierarchy</h1>
					<p class="fs-4">Find the direct parents and children of a specific GO ID.</p>
				</div>
			</div>
		</div>
	</header>
	
	<section class="pt-4">
		<div class="container px-lg-5">
			<div class="row gx-lg-5">
				<div class="col-lg-6 col-xxl-4 mb-5">
					<div class="mb-2">
						<label for="go_id" class="form-label">Enter GO ID</label>
						<input type="text" class="form-control" id="go_id" placeholder="e.g., GO:0008150">
					</div>
				</div>
			</div>
			
			<div class="row gx-lg-5">
				<div class="col-lg-6 col-xxl-4 mb-5">
					<div class="d-flex gap-2">
						<button type="button" class="btn btn-primary" id="btnSearch">
							<span id="btnSearchSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
							<span id="btnSearchText">Search</span>
						</button>
					</div>
				</div>
			</div>
			
			<div class="mt-4" id="results">
				<!-- Results will be injected here -->
			</div>
		</div>
	</section>
	
	<footer class="py-5 bg-dark">
		<div class="container"><p class="m-0 text-center text-white">Copyright &copy; Your Website 2023</p></div>
	</footer>

	<script>
	(function () {
		const btn = document.getElementById('btnSearch');
		const spinner = document.getElementById('btnSearchSpinner');
		const resultsDiv = document.getElementById('results');

		function showSpinner() {
			spinner.classList.remove('d-none');
			btn.setAttribute('disabled', 'disabled');
		}

		function hideSpinner() {
			spinner.classList.add('d-none');
			btn.removeAttribute('disabled');
		}

		btn.addEventListener('click', async function () {
			const go_id = document.getElementById('go_id').value.trim();
			resultsDiv.innerHTML = '';

			if (!go_id) {
				resultsDiv.innerHTML = '<div class="alert alert-warning">Please enter a GO ID.</div>';
				return;
			}

			showSpinner();
			try {
				const resp = await fetch('/search_hierarchy', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ go_id: go_id })
				});

				const data = await resp.json().catch(() => null);

				if (!resp.ok) {
					const msg = (data && data.error) ? data.error : ('HTTP ' + resp.status);
					resultsDiv.innerHTML = '<div class="alert alert-danger">Error: ' + String(msg) + '</div>';
				} else {
					// Render results
					if (data.parents.length === 0 && data.children.length === 0) {
						resultsDiv.innerHTML = '<div class="alert alert-info">No parents or children found for this term.</div>';
					} else {
						// Create two columns
						let html = '<div class="row">';
						
						// Parents Column
						html += '<div class="col-md-6 mb-3">';
						html += '<h5>Parents</h5><ul class="list-group">';
						data.parents.forEach(p => {
							html += '<li class="list-group-item">' + p + '</li>';
						});
						if (data.parents.length === 0) html += '<li class="list-group-item text-muted">No parents found.</li>';
						html += '</ul></div>';

						// Children Column
						html += '<div class="col-md-6 mb-3">';
						html += '<h5>Children</h5><ul class="list-group">';
						data.children.forEach(c => {
							html += '<li class="list-group-item">' + c + '</li>';
						});
						if (data.children.length === 0) html += '<li class="list-group-item text-muted">No children found.</li>';
						html += '</ul></div>';

						html += '</div>';
						resultsDiv.innerHTML = html;
					}
				}
			} catch (ex) {
				resultsDiv.innerHTML = '<div class="alert alert-danger">Request failed: ' + String(ex) + '</div>';
			} finally {
				hideSpinner();
			}
		});
	})();
	</script>
</body>
</html>
